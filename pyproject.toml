[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "marlax"
version = "0.1.0"
description = "JAX-first cooperative multi-agent reinforcement learning"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "jax>=0.10",
    "numpy>=2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]
gpu = [
    "jax[cuda13]>=0.10",
]
docs = [
    "sphinx>=8",
    "myst-nb>=1.2",
]
tutorials = [
    "jupyterlab>=4",
    "nbclient>=0.10",
    "nbformat>=5.10",
    "ipykernel>=6",
    "matplotlib>=3.10",
]
viz = [
    "matplotlib>=3.10",
]
all = [
    "jax[cuda13]>=0.10",
    "matplotlib>=3.10",
    "pytest>=8",
    "sphinx>=8",
    "myst-nb>=1.2",
    "jupyterlab>=4",
    "nbclient>=0.10",
    "nbformat>=5.10",
    "ipykernel>=6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
