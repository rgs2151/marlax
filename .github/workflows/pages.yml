name: Publish documentation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    name: Documentation and saved tutorials
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      JAX_PLATFORMS: cpu
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install documentation dependencies
        run: python -m pip install '.[docs]'
      - name: Render documentation without executing notebooks
        run: python -m sphinx -W --keep-going -b html docs/source docs/build/html
      - name: Assemble gallery and documentation
        run: |
          mkdir -p build/pages/gallery
          cp -a docs/build/html/. build/pages/
          cp -a site/. build/pages/gallery/
          touch build/pages/.nojekyll
      - name: Upload reviewable site
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: marlax-site
          path: build/pages
          include-hidden-files: true
          retention-days: 7
      - name: Configure GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/configure-pages@v6
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: build/pages

  deploy:
    name: Publish GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: docs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
